version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./static:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf

  api:
    image: python:3.12.3
    working_dir: /app
    volumes:
      - ./backend:/app
    command: sh -c "pip install -r requirements.txt && uvicorn fast_start:app --reload --host 0.0.0.0 --port 8000"
    expose:
      - "8000"
    depends_on:
      - postgres

  aiogram:
    image: python:3.12.3
    working_dir: /app
    volumes:
      - ./backend:/app
    command: sh -c "pip install -r requirements.txt && alembic upgrade head && python main.py"
    depends_on:
      - postgres

  postgres:
    image: postgres:17 
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: 0501Valeev
      POSTGRES_USER: postgres
      POSTGRES_DB: kaicloud
    volumes:
      - postgres_data:/var/lib/postgresql/data  
    
  pgadmin:
    image: dpage/pgadmin4:9.8
    ports:
      - 8080:80
    environment:
      PGADMIN_DEFAULT_EMAIL: demo@example.com
      PGADMIN_DEFAULT_PASSWORD: secret
  
volumes:
  postgres_data:
