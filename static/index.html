<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KaiCloud</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:'Inter',sans-serif;
    background:#bfb6b6;
}

.wrapper{
    min-height:100vh;
    background:#2f2f33;
    display:flex;
    flex-direction:column;
}

header{
    position: relative;
    border-bottom:1px solid rgba(255,255,255,0.1);
    padding:18px 40px;
    display:flex;
    justify-content:center; /* центрируем логотип */
    align-items:center;
    color:white;
}

.header-right{
    position: absolute;
    right: 40px; /* справа */
}



.logo{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:22px;
    font-weight:500;
}

.logo img{
    width:42px;
    height:42px;
    border-radius:50%;
    object-fit:cover;
}

main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px 20px;
    color:white;
}

h1{
    font-size:44px;
    margin-bottom:20px;
}

.subtitle{
    max-width:700px;
    font-size:18px;
    line-height:1.6;
    color:#cfcfcf;
    margin-bottom:50px;
}

.card{
    background:#e5e5e5;
    width:420px;
    max-width:95%;
    border-radius:18px;
    padding:35px 30px;
    box-shadow:0 10px 30px rgba(0,0,0,0.25);
}

.card h3{
    color:#333;
    margin-bottom:20px;
}

.card input{
    width:100%;
    height:38px;
    border-radius:8px;
    border:none;
    background:#cfcfcf;
    margin-bottom:25px;
    padding:0 12px;
    font-size:14px;
    outline:none;
}

.card button{
    width:150px;
    height:42px;
    border-radius:20px;
    border:none;
    background:#8bbbd6;
    color:#1d2b34;
    font-size:15px;
    cursor:pointer;
    transition:0.2s;
}

.card button:hover{
    background:#74a9c9;
}

.card button:disabled{
    background:#9daab3;
    cursor:not-allowed;
}

.status{
    margin-top:18px;
    font-size:14px;
    min-height:18px;
    color:#333;
}

.hint{
    margin-top:25px;
    font-size:14px;
    color:#cfcfcf;
}

@media (max-width:768px){
    h1{font-size:32px;}
    .subtitle{font-size:16px;}
    header{padding:15px 20px;}
}

@media (max-width:480px){
    h1{font-size:26px;}
    .subtitle{font-size:14px;}
    .card{padding:25px 20px;}
}
</style>
</head>

<body>

<div class="wrapper">
<header>
    <div class="logo">
        <img src="/logo.jpg" alt="logo">
        KaiCloud
    </div>
    <div class="header-right">Инструкция ▾</div>
</header>


<main>

<h1>Загрузка файлов по ID</h1>

<div class="subtitle">
KaiCloud — ваш надёжный помощник для загрузки файлов по уникальному идентификатору из бота.<br>
Введите ID и начните загрузку файлов прямо сейчас!
</div>

<div class="card">
    <h3>Введите ваш id!</h3>

    <form id="startForm">
        <input id="userId" type="text" placeholder="Например: 12345678" required>
        <button id="startBtn" type="submit">Начать</button>
    </form>

    <div class="status" id="status"></div>
</div>

<div class="hint">
Получить id можно в @kit_raspisanie_bot<br>
в разделе Cloud
</div>

</main>
</div>

<script>
const API_URL = "/api/saitid";

const form = document.getElementById("startForm");
const input = document.getElementById("userId");
const button = document.getElementById("startBtn");
const statusBlock = document.getElementById("status");

form.addEventListener("submit", async function(e){
    e.preventDefault();

    const id = input.value.trim();

    if(!id){
        statusBlock.innerText = "Введите ID!";
        return;
    }

    button.disabled = true;
    statusBlock.innerText = "Добро пожаловать в KaiCloud!";

    try{
        const response = await fetch(API_URL,{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body: JSON.stringify({ id:id })
        });

        let data = {};
        try{
            data = await response.json();
        }catch{}

        if(response.ok){

            // 🔥 РЕДИРЕКТ ЕСЛИ message === true
            if(data.message === true){
                window.location.href = "/send/";
                return;
            }

            statusBlock.innerText = data.message || "Запрос обработан.";

        }else{
            statusBlock.innerText = data.error || "Неверный ID или ошибка сервера";
        }

    }catch(err){
        statusBlock.innerText = "Не удалось подключиться к серверу";
        console.error(err);
    }

    button.disabled = false;
});
</script>

</body>
</html>
